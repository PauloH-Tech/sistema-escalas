spring:
  application:
    name: controle-escalas
  profiles:
    active: development
  datasource:
    url: jdbc:h2:file:./dados/escala
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 8082



---
spring:
  config:
    activate:
      on-profile: production
  datasource:
    url: jdbc:postgresql://localhost:5432/roster
    driver-class-name: org.postgresql.Driver
    password: postgresadmin
    username: postgres
  jpa:
    show-sql: true

---
spring:
  config:
    activate:
      on-profile: development
  datasource:
    url: jdbc:postgresql://localhost:5432/roster
    driver-class-name: org.postgresql.Driver
    password: postgresadmin
    username: postgres
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
  output:
    ansi:
      enabled: ALWAYS

